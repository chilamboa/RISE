{% extends "base.html" %}

{% block title %}Parent Dashboard{% endblock %}

{% block content %}
<section class="max-w-7xl mx-auto">
    <h2 class="text-3xl font-bold text-gray-800 dark:text-gray-100 mb-6">Parent Dashboard</h2>
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <div class="bg-white dark:bg-slate-800 p-6 rounded-xl shadow-sm">
            <h3 class="text-lg font-semibold text-gray-800 dark:text-gray-100 mb-6">My Children's Performance</h3>
            <canvas id="childrenPerformanceChart"></canvas>
        </div>
        <div class="bg-white dark:bg-slate-800 p-6 rounded-xl shadow-sm">
            <h3 class="text-lg font-semibold text-gray-800 dark:text-gray-100 mb-6">Upcoming Events</h3>
            <p>Parent-teacher meetings: 2023-11-15</p>
        </div>
    </div>
</section>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const ctx = document.getElementById('childrenPerformanceChart').getContext('2d');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['Alice', 'Bob'],
                datasets: [{
                    label: 'Overall Score',
                    data: [85, 72],
                    backgroundColor: [
                        'rgba(75, 192, 192, 0.2)',
                        'rgba(255, 99, 132, 0.2)'
                    ],
                    borderColor: [
                        'rgba(75, 192, 192, 1)',
                        'rgba(255, 99, 132, 1)'
                    ],
                    borderWidth: 1
                }]
            },
            options: {
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });
    });
</script>
{% endblock %}
