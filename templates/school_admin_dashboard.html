{% extends "base.html" %}

{% block title %}School Administrator Dashboard{% endblock %}

{% block content %}
<section class="max-w-7xl mx-auto">
    <h2 class="text-3xl font-bold text-gray-800 dark:text-gray-100 mb-6">School Administrator Dashboard</h2>
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <div class="bg-white dark:bg-slate-800 p-6 rounded-xl shadow-sm">
            <h3 class="text-lg font-semibold text-gray-800 dark:text-gray-100 mb-6">School-wide Performance</h3>
            <canvas id="schoolPerformanceChart"></canvas>
        </div>
        <div class="bg-white dark:bg-slate-800 p-6 rounded-xl shadow-sm">
            <h3 class="text-lg font-semibold text-gray-800 dark:text-gray-100 mb-6">Teacher Performance</h3>
            <canvas id="teacherPerformanceChart"></canvas>
        </div>
    </div>
</section>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const schoolCtx = document.getElementById('schoolPerformanceChart').getContext('2d');
        new Chart(schoolCtx, {
            type: 'line',
            data: {
                labels: ['Term 1', 'Term 2', 'Term 3', 'Term 4'],
                datasets: [{
                    label: 'School Average',
                    data: [70, 75, 72, 78],
                    borderColor: 'rgba(75, 192, 192, 1)',
                    tension: 0.1
                }]
            }
        });

        const teacherCtx = document.getElementById('teacherPerformanceChart').getContext('2d');
        new Chart(teacherCtx, {
            type: 'bar',
            data: {
                labels: ['Mr. Smith', 'Ms. Jones', 'Mr. Williams'],
                datasets: [{
                    label: 'Average Student Score',
                    data: [80, 75, 85],
                    backgroundColor: [
                        'rgba(255, 99, 132, 0.2)',
                        'rgba(54, 162, 235, 0.2)',
                        'rgba(255, 206, 86, 0.2)'
                    ],
                    borderColor: [
                        'rgba(255, 99, 132, 1)',
                        'rgba(54, 162, 235, 1)',
                        'rgba(255, 206, 86, 1)'
                    ],
                    borderWidth: 1
                }]
            },
            options: {
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });
    });
</script>
{% endblock %}
